name: Python security smoke tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q privacyvpn tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: nftables syntax (check only; never apply)
        shell: bash
        run: |
          set -eu
          if ! command -v nft >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y nftables
          fi
          python -c 'from pathlib import Path; from privacyvpn.firewall import client_policy, entry_policy, exit_policy; Path("/tmp/gcvpn-ci-firewall.nft").write_text(client_policy("203.0.113.10", 443, "tcp") + entry_policy() + exit_policy("eth0"))'
          sudo nft -c -f /tmp/gcvpn-ci-firewall.nft
      - name: Isolated kernel kill-switch test (temporary network namespace)
        run: sudo python3 tests/lab/check_client_firewall.py
      - name: Three-node WireGuard relay and transit outage (temporary namespaces)
        shell: bash
        run: |
          set -eu
          if ! command -v wg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y wireguard-tools
          fi
          sudo python3 tests/lab/check_twohop_wireguard.py
          sudo env GCVPN_FAILURE=entry python3 tests/lab/check_twohop_wireguard.py
          sudo env GCVPN_FAILURE=exit python3 tests/lab/check_twohop_wireguard.py
      - name: WSS TLS untrusted-server rejection (verified upstream binary)
        shell: bash
        run: |
          set -eu
          labdir="$(mktemp -d)"
          trap 'rm -rf "$labdir"' EXIT
          curl --fail --location --silent --show-error --retry 2 \
            --output "$labdir/wstunnel.tar.gz" \
            https://github.com/erebe/wstunnel/releases/download/v11.0.0/wstunnel_11.0.0_linux_amd64.tar.gz
          echo "9708a99717b5a951453c2ff7c14c25d3418d02ca7fcb96fdb382a8f2083bab5e  $labdir/wstunnel.tar.gz" | sha256sum -c -
          tar -xzf "$labdir/wstunnel.tar.gz" -C "$labdir" wstunnel
          chmod 0700 "$labdir/wstunnel"
          GCVPN_WSTUNNEL="$labdir/wstunnel" python3 tests/lab/check_wss_tls.py
      - name: Key and config hygiene
        shell: bash
        run: |
          set -eu
          if git ls-files | grep -E '\.(key|pem|conf|nft|env)$|(^|/)topology\.json$'; then
            echo "Refusing to pass: sensitive generated file is tracked" >&2
            exit 1
          fi
